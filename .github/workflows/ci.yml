name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Astro caches generated images in node_modules/.astro. Restoring it
      # makes AVIF encoding incremental — without it, the build re-encodes
      # ~100 variants on 2 vCPUs (3-4 min) every run. Must restore after
      # npm ci, which wipes node_modules.
      - name: Restore Astro image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-image-cache-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-image-cache-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
