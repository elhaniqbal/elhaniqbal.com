name: Deploy

on:
  # push:
  #   branches: [main]          # production deploy
  # pull_request:
  #   branches: [main]          # preview deploy (shows up as a separate CF Pages URL)
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write     # lets CF action post a preview URL comment on PRs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'         # caches node_modules between runs

      - name: Install dependencies
        run: npm ci            # reproducible install (uses package-lock.json)

      - name: Build
        run: npm run build

      # ── Cloudflare Pages deploy ─────────────────────────────────────────────
      # Required secrets (add in GitHub → Settings → Secrets → Actions):
      #   CLOUDFLARE_API_TOKEN  — create at dash.cloudflare.com/profile/api-tokens
      #                           use the "Edit Cloudflare Pages" template
      #   CLOUDFLARE_ACCOUNT_ID — found in the right sidebar of your CF dashboard
      #
      # projectName must match the name you give the project in CF Pages dashboard.
      # ────────────────────────────────────────────────────────────────────────
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: elhan-portfolio        # ← change this to your CF project name
          directory:  dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref || github.ref_name }}
